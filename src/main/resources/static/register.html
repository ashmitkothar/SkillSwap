<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillSwap - Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0B1220;
            color: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            width: 90%;
            max-width: 440px;
            padding: 32px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 16px;
        }

        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #60A5FA;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94A3B8;
            margin-bottom: 28px;
            font-size: 14px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 22px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            background: #0B1220;
            color: #F8FAFC;
            border: 1px solid #334155;
            border-radius: 10px;
            outline: none;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #3B82F6;
        }

        input::placeholder,
        textarea::placeholder {
            color: #64748B;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563EB;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover {
            background: #1D4ED8;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #94A3B8;
            font-size: 14px;
        }

        .login-link a {
            color: #60A5FA;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="register-box">

    <div class="logo">SkillSwap</div>

    <div class="subtitle">
        Learn. Teach. Connect.
    </div>

    <h1>Create Account</h1>

    <input
            type="text"
            id="name"
            placeholder="Enter your name"
    >

    <input
            type="email"
            id="email"
            placeholder="Enter your email"
    >

    <input
            type="password"
            id="password"
            placeholder="Create a password"
    >

    <textarea
            id="bio"
            placeholder="Tell us something about yourself..."
    ></textarea>

    <button
            type="button"
            class="register-btn"
            onclick="registerUser()">
        Create Account
    </button>

    <div class="login-link">
        Already have an account?
        <a href="/login.html">Login</a>
    </div>

</div>

<script src="/register.js"></script>

</body>

</html>
