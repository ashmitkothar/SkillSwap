<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillSwap - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0B1220;
            color: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            padding: 32px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 16px;
        }

        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #60A5FA;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94A3B8;
            margin-bottom: 28px;
            font-size: 14px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 22px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            background: #0B1220;
            color: #F8FAFC;
            border: 1px solid #334155;
            border-radius: 10px;
            outline: none;
        }

        input:focus {
            border-color: #3B82F6;
        }

        input::placeholder {
            color: #64748B;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563EB;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #1D4ED8;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #94A3B8;
            font-size: 14px;
        }

        .register-link a {
            color: #60A5FA;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">SkillSwap</div>

    <div class="subtitle">
        Learn. Teach. Connect.
    </div>

    <h1>Login</h1>

    <input
            type="email"
            id="email"
            placeholder="Enter your email"
    >

    <input
            type="password"
            id="password"
            placeholder="Enter your password"
    >

    <button
            type="button"
            class="login-btn"
            onclick="login()">
        Login
    </button>

    <div class="register-link">
        Don't have an account?
        <a href="/register.html">Create one</a>
    </div>

</div>

<script src="/login.js"></script>

</body>

</html>
